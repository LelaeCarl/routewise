{% set p = request.path %}
<div class="flex h-12 items-center justify-between border-b border-slate-300 bg-surface px-3 lg:hidden">
  <a href="{{ url_for('home') }}" class="inline-flex items-center gap-2">
    <span class="inline-flex h-7 w-7 items-center justify-center border border-slate-300 bg-surface p-0.5">
      <img src="{{ url_for('static', filename='img/logo.png') }}" alt="" class="h-5 w-auto object-contain" />
    </span>
    <span class="text-sm font-semibold text-slate-900">RouteWise</span>
  </a>
  <details class="relative">
    <summary class="list-none rounded-sm border border-slate-300 bg-surface px-2.5 py-1 text-[13px] font-semibold text-slate-800">Menu</summary>
    <div class="absolute right-0 z-50 mt-1 w-52 overflow-hidden border border-slate-300 bg-surface py-0.5 shadow-none">
      <a class="block px-3 py-2 text-[13px] text-slate-800 hover:bg-panel" href="{{ url_for('home') }}">Home</a>
      <a class="block px-3 py-2 text-[13px] text-slate-800 hover:bg-panel" href="{{ url_for('planner') }}">Plan route</a>
      <a class="block px-3 py-2 text-[13px] text-slate-800 hover:bg-panel" href="{{ url_for('analyses') }}">Recent analyses</a>
      <a class="block px-3 py-2 text-[13px] text-slate-800 hover:bg-panel" href="{{ url_for('hubs') }}">Hubs</a>
      <a class="block px-3 py-2 text-[13px] text-slate-800 hover:bg-panel" href="{{ url_for('about') }}">About</a>
      {% if is_admin %}
        <a class="block px-3 py-2 text-[13px] font-semibold text-primary hover:bg-panel" href="{{ url_for('admin.dashboard') }}">Admin</a>
      {% endif %}
      <div class="my-1 h-px bg-slate-200"></div>
      <a class="block px-3 py-2 text-[13px] text-slate-800 hover:bg-panel" href="{{ url_for('profile') }}">Profile</a>
      <a class="block px-3 py-2 text-[13px] text-slate-600 hover:bg-panel" href="{{ url_for('auth.logout') }}">Log out</a>
    </div>
  </details>
</div>
