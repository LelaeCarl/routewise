{# Left navigation for logged-in workspace #}
{% set p = request.path %}
<aside class="hidden w-[min(15rem,100%)] shrink-0 flex-col border-r border-slate-300 bg-surface lg:flex">
  <div class="flex h-12 items-center gap-2 border-b border-slate-300 px-3">
    <a href="{{ url_for('home') }}" class="group inline-flex items-center gap-2">
      <span class="inline-flex h-7 w-7 items-center justify-center border border-slate-300 bg-surface p-0.5">
        <img
          src="{{ url_for('static', filename='img/logo.png') }}"
          alt=""
          class="h-6 w-auto object-contain"
          loading="eager"
        />
      </span>
      <span class="text-sm font-semibold tracking-tight text-slate-900">RouteWise</span>
    </a>
  </div>

  <p class="px-3 pt-4 pb-1 text-[10px] font-semibold uppercase tracking-[0.12em] text-slate-500">Workspace</p>
  <nav class="flex flex-1 flex-col gap-0 px-1 pb-3" aria-label="Primary">
    <a href="{{ url_for('home') }}" class="rw-side-nav {% if p == '/home' %}rw-side-nav--active{% endif %}" {% if p == '/home' %}aria-current="page"{% endif %}>Home</a>
    <a
      href="{{ url_for('planner') }}"
      class="rw-side-nav {% if p == '/planner' or p == '/results' %}rw-side-nav--active{% endif %}"
      {% if p == '/planner' or p == '/results' %}aria-current="page"{% endif %}
    >Plan route</a>
    <a href="{{ url_for('analyses') }}" class="rw-side-nav {% if p == '/analyses' %}rw-side-nav--active{% endif %}" {% if p == '/analyses' %}aria-current="page"{% endif %}>Recent analyses</a>
    <a href="{{ url_for('hubs') }}" class="rw-side-nav {% if p == '/hubs' %}rw-side-nav--active{% endif %}" {% if p == '/hubs' %}aria-current="page"{% endif %}>Hubs</a>
    <a href="{{ url_for('pricing') }}" class="rw-side-nav {% if p == '/pricing' %}rw-side-nav--active{% endif %}" {% if p == '/pricing' %}aria-current="page"{% endif %}>Pricing &amp; Rates</a>
    <a href="{{ url_for('about') }}" class="rw-side-nav {% if p == '/about' %}rw-side-nav--active{% endif %}" {% if p == '/about' %}aria-current="page"{% endif %}>About</a>
    {% if is_admin %}
      <p class="px-2 pt-4 pb-1 text-[10px] font-semibold uppercase tracking-[0.12em] text-slate-500">Operations</p>
      <a
        href="{{ url_for('admin.dashboard') }}"
        class="rw-side-nav {% if p.startswith('/admin') %}rw-side-nav--active{% endif %}"
        {% if p.startswith('/admin') %}aria-current="page"{% endif %}
      >Admin</a>
    {% endif %}
  </nav>

  <div class="mt-auto border-t border-slate-300 px-1 py-3">
    <a href="{{ url_for('profile') }}" class="rw-side-nav {% if p == '/profile' %}rw-side-nav--active{% endif %} mb-0.5" {% if p == '/profile' %}aria-current="page"{% endif %}>Profile</a>
    <a href="{{ url_for('auth.logout') }}" class="rw-side-nav rw-side-nav--muted">Log out</a>
    <p class="mt-2 truncate px-2 text-[10px] leading-snug text-slate-500" title="{{ current_user.email }}">{{ current_user.username }}</p>
  </div>
</aside>
