{% extends "base.html" %}

{% block content %}
  <div class="h-[calc(100vh-3rem)] overflow-hidden grid lg:grid-cols-[55%_45%]">
    <section class="h-full flex items-center justify-center px-4 sm:px-8">
      <div class="w-full max-w-[400px]">
        <div class="flex items-center gap-2">
          <span class="inline-flex items-center justify-center border border-slate-300 bg-surface p-1 overflow-hidden">
            <img
              src="{{ url_for('static', filename='img/logo.png') }}"
              alt="RouteWise"
              class="h-10 w-auto object-contain"
              loading="eager"
            />
          </span>
          <span class="text-sm font-semibold text-slate-900">RouteWise</span>
        </div>

        <h1 class="mt-4 text-2xl font-semibold tracking-tight text-slate-900">Sign in</h1>
        <p class="mt-1 text-sm text-slate-600">Access your planning workspace.</p>

        <form method="POST" class="mt-5 space-y-3">
          {% if request.args.get('next') %}
            <input type="hidden" name="next" value="{{ request.args.get('next') }}" />
          {% endif %}
          <div>
            <label class="text-xs font-semibold uppercase tracking-wide text-slate-600" for="email">Email</label>
            <input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              value="{{ (form.email if form else '') }}"
              class="mt-1.5 w-full rounded-sm border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 shadow-none focus:border-accent focus:outline-none focus:ring-1 focus:ring-accent/50"
              required
            />
          </div>

          <div>
            <label class="text-xs font-semibold uppercase tracking-wide text-slate-600" for="password">Password</label>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              class="mt-1.5 w-full rounded-sm border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 shadow-none focus:border-accent focus:outline-none focus:ring-1 focus:ring-accent/50"
              required
            />
          </div>

          <button
            type="submit"
            class="inline-flex w-full items-center justify-center rounded-sm border border-primary bg-primary px-4 py-2.5 text-sm font-semibold text-white hover:bg-slate-900 focus:outline-none focus:ring-2 focus:ring-accent/40"
          >
            Log in
          </button>

          <p class="text-sm text-slate-600">
            New to RouteWise?
            <a class="font-semibold text-accent hover:underline" href="{{ url_for('auth.register') }}">Create an account</a>
          </p>
        </form>
      </div>
    </section>

    <aside class="hidden lg:flex h-full p-4 bg-panel border-l border-slate-300">
      <div class="h-full w-full overflow-hidden border border-slate-300 bg-surface">
        <img
          src="{{ url_for('static', filename='images/auth-side.png') }}"
          alt=""
          class="h-full w-full object-cover opacity-90"
        />
      </div>
    </aside>
  </div>
{% endblock %}
