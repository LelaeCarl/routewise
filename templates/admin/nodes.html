{% extends "base.html" %}

{% block content %}
  <div class="flex flex-wrap items-end justify-between gap-4">
    <div>
      <h1 class="text-2xl font-semibold tracking-tight text-slate-900 sm:text-3xl">Nodes</h1>
      <p class="mt-1 text-sm text-slate-600">Read-only network directory.</p>
    </div>
    <a href="{{ url_for('admin.dashboard') }}" class="rounded-sm border border-slate-300 bg-panel px-3 py-2 text-sm font-semibold text-slate-800 hover:bg-surface">
      ← Dashboard
    </a>
  </div>

  <div class="mt-5 grid gap-3 md:grid-cols-2 lg:grid-cols-3">
    {% for n in nodes %}
      <div class="border border-slate-300 bg-surface p-4">
        <div class="flex items-start justify-between gap-2">
          <div>
            <p class="text-sm font-semibold text-slate-900">{{ n.name }}</p>
            <p class="mt-0.5 text-xs text-slate-600">{{ n.city }}, {{ n.country }}</p>
          </div>
          <span class="shrink-0 border border-slate-300 bg-panel px-2 py-0.5 text-[10px] font-semibold uppercase tracking-wide text-slate-600">
            {{ n.type | format_node_type }}
          </span>
        </div>
        <p class="mt-3 text-xs text-slate-600">{{ n.description }}</p>
        <p class="mt-2 font-mono text-[10px] text-slate-500"><span class="font-sans font-medium text-slate-600">id</span> {{ n.id }}</p>
      </div>
    {% endfor %}
  </div>
{% endblock %}
