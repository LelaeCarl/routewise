{% extends "base.html" %}

{% block content %}
  <div class="flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
    <div>
      <h1 class="text-2xl font-semibold tracking-tight text-slate-900 sm:text-3xl">Edit user</h1>
      <p class="mt-1 text-sm text-slate-600">Identity, role, optional password reset.</p>
    </div>
    <a href="{{ url_for('admin.users') }}" class="shrink-0 rounded-sm border border-slate-300 bg-panel px-3 py-2 text-sm font-semibold text-slate-800 hover:bg-surface">
      ← Users
    </a>
  </div>

  <form method="post" class="mt-6 max-w-xl space-y-4 border border-slate-300 bg-surface p-5">
    <div>
      <label class="text-xs font-semibold uppercase tracking-wide text-slate-600" for="username">Username</label>
      <input id="username" name="username" type="text" required autocomplete="off"
        value="{{ form.get('username', member.username) if form else member.username }}"
        class="mt-1.5 w-full rounded-sm border border-slate-300 bg-white px-3 py-2 text-sm shadow-none focus:border-accent focus:outline-none focus:ring-1 focus:ring-accent/40" />
    </div>
    <div>
      <label class="text-xs font-semibold uppercase tracking-wide text-slate-600" for="email">Email</label>
      <input id="email" name="email" type="email" required autocomplete="off"
        value="{{ form.get('email', member.email) if form else member.email }}"
        class="mt-1.5 w-full rounded-sm border border-slate-300 bg-white px-3 py-2 text-sm shadow-none focus:border-accent focus:outline-none focus:ring-1 focus:ring-accent/40" />
    </div>
    <div>
      <label class="text-xs font-semibold uppercase tracking-wide text-slate-600" for="role">Role</label>
      {% set r = form.get('role', member.role) if form else member.role %}
      <select id="role" name="role"
        class="mt-1.5 w-full rounded-sm border border-slate-300 bg-white px-3 py-2 text-sm shadow-none focus:border-accent focus:outline-none focus:ring-1 focus:ring-accent/40">
        <option value="user" {% if r == 'user' %}selected{% endif %}>User</option>
        <option value="admin" {% if r == 'admin' %}selected{% endif %}>Admin</option>
      </select>
    </div>
    <div>
      <label class="text-xs font-semibold uppercase tracking-wide text-slate-600" for="password">New password</label>
      <input id="password" name="password" type="password" autocomplete="new-password" minlength="6"
        placeholder="Leave blank to keep current password"
        class="mt-1.5 w-full rounded-sm border border-slate-300 bg-white px-3 py-2 text-sm shadow-none focus:border-accent focus:outline-none focus:ring-1 focus:ring-accent/40" />
      <p class="mt-1 text-xs text-slate-500">Optional. Minimum 6 characters when set.</p>
    </div>
    <div class="flex flex-wrap gap-2 pt-1">
      <button type="submit" class="rounded-sm border border-primary bg-primary px-4 py-2 text-sm font-semibold text-white hover:bg-slate-900">
        Save
      </button>
      <a href="{{ url_for('admin.users') }}" class="rounded-sm border border-slate-300 bg-white px-4 py-2 text-sm font-semibold text-slate-800 hover:bg-panel">
        Cancel
      </a>
    </div>
  </form>
{% endblock %}
