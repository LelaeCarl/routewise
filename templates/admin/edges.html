{% extends "base.html" %}

{% block content %}
  <div class="flex flex-wrap items-end justify-between gap-4">
    <div>
      <h1 class="text-2xl font-semibold tracking-tight text-slate-900 sm:text-3xl">Edges</h1>
      <p class="mt-1 text-sm text-slate-600">Directed corridors (read-only).</p>
    </div>
    <a href="{{ url_for('admin.dashboard') }}" class="rounded-sm border border-slate-300 bg-panel px-3 py-2 text-sm font-semibold text-slate-800 hover:bg-surface">
      ← Dashboard
    </a>
  </div>

  <div class="mt-5 overflow-x-auto border border-slate-300 bg-surface">
    <table class="w-full min-w-[800px] text-left text-sm">
      <thead class="border-b border-slate-300 bg-panel text-[10px] font-semibold uppercase tracking-wide text-slate-600">
        <tr>
          <th class="px-3 py-2">From</th>
          <th class="px-3 py-2">To</th>
          <th class="px-3 py-2">Mode</th>
          <th class="px-3 py-2">Time (d)</th>
          <th class="px-3 py-2">Notes</th>
          <th class="px-3 py-2">ID</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-slate-200">
        {% for e in edges %}
          <tr>
            <td class="px-3 py-2 font-mono text-xs text-slate-800">{{ e.from_node }}</td>
            <td class="px-3 py-2 font-mono text-xs text-slate-800">{{ e.to_node }}</td>
            <td class="px-3 py-2 text-slate-700">{{ e.mode }}</td>
            <td class="px-3 py-2 font-mono text-xs text-slate-700">{{ e.time | round(2) }}</td>
            <td class="px-3 py-2 text-xs text-slate-600">{{ e.description }}</td>
            <td class="px-3 py-2 font-mono text-[10px] text-slate-500">{{ e.id }}</td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
{% endblock %}
